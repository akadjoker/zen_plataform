name: macOS

# The native macOS port is developed on branches called mac-*. Like ci.yml, a push only
# runs the job when the head commit message carries the marker (here "[mac]"), so a push
# costs nothing unless the commit asks for it. Run it by hand from the Actions tab too.
on:
  push:
    branches: ["mac-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple Silicon)
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[mac]')
    # on the job, not the workflow: a push without the marker skips the job and must not cancel a run in progress
    concurrency:
      group: mac-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      # warnings that come from the vendored stb headers are not ours
      WARN_FILTER: "stb_"
    steps:
      - uses: actions/checkout@v4

      - name: Machine, OS and toolchain
        run: |
          sw_vers
          uname -a
          sysctl -n machdep.cpu.brand_string || true
          xcodebuild -version || true
          xcrun clang --version
          echo "SDK: $(xcrun --show-sdk-version)  $(xcrun --show-sdk-path)"
          cmake --version | head -1
          echo "GUI session: $(launchctl managername 2>&1)"
          ps -ax -o pid,comm | grep -E "WindowServer|loginwindow|Finder" | grep -v grep || true
          /usr/sbin/system_profiler -detailLevel mini SPDisplaysDataType 2>&1 | head -40 || true

      # ---- phase 1: the library with no window ----
      - name: Fake backend, build (-Wall -Wextra)
        id: fake_build
        continue-on-error: true
        run: |
          cmake -S . -B build-fake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DPLATFORM_USE_FAKE=ON \
                -DCMAKE_C_FLAGS="-Wall -Wextra"
          cmake --build build-fake -j4 -- -k 2>&1 | tee build-fake.log
          test "${PIPESTATUS[0]}" = 0
      - name: Fake backend, warnings of our own code
        id: fake_warn
        continue-on-error: true
        run: |
          if grep "warning:" build-fake.log | grep -v "$WARN_FILTER"; then echo "warnings above"; exit 1; fi
          echo "no warnings"
      - name: Fake backend, ctest
        id: fake_test
        continue-on-error: true
        run: ctest --test-dir build-fake --output-on-failure --timeout 120

      - name: Fake backend + ASan/UBSan, build
        id: fake_asan_build
        continue-on-error: true
        run: |
          cmake -S . -B build-fake-asan -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug -DPLATFORM_USE_FAKE=ON \
                -DPLATFORM_SANITIZE=ON -DCMAKE_C_FLAGS="-Wall -Wextra"
          cmake --build build-fake-asan -j4 -- -k 2>&1 | tee build-fake-asan.log
          test "${PIPESTATUS[0]}" = 0
      - name: Fake backend + ASan/UBSan, ctest
        id: fake_asan_test
        continue-on-error: true
        run: ctest --test-dir build-fake-asan --output-on-failure --timeout 240

      # ---- phase 2: the native backend (AppKit), on the runner's own window server ----
      - name: Native backend, build (-Wall -Wextra)
        id: native_build
        continue-on-error: true
        run: |
          cmake -S . -B build-native -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="-Wall -Wextra" -DCMAKE_OBJC_FLAGS="-Wall -Wextra"
          cmake --build build-native -j4 -- -k 2>&1 | tee build-native.log
          test "${PIPESTATUS[0]}" = 0
      - name: Native backend, warnings of our own code
        id: native_warn
        continue-on-error: true
        run: |
          if grep "warning:" build-native.log | grep -v "$WARN_FILTER"; then echo "warnings above"; exit 1; fi
          echo "no warnings"
      - name: Native backend, ctest
        id: native_test
        continue-on-error: true
        env:
          ZP_REQUIRE_DISPLAY: "1"
        run: ctest --test-dir build-native --output-on-failure --timeout 120
      - name: Native backend, window test output
        id: native_window
        continue-on-error: true
        env:
          ZP_REQUIRE_DISPLAY: "1"
        run: ctest --test-dir build-native -R test_cocoa_window -V --timeout 120

      - name: Native backend + ASan/UBSan, build
        id: native_asan_build
        continue-on-error: true
        run: |
          cmake -S . -B build-native-asan -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug -DPLATFORM_SANITIZE=ON \
                -DCMAKE_C_FLAGS="-Wall -Wextra" -DCMAKE_OBJC_FLAGS="-Wall -Wextra"
          cmake --build build-native-asan -j4 -- -k 2>&1 | tee build-native-asan.log
          test "${PIPESTATUS[0]}" = 0
      - name: Native backend + ASan/UBSan, ctest
        id: native_asan_test
        continue-on-error: true
        env:
          ZP_REQUIRE_DISPLAY: "1"
        run: ctest --test-dir build-native-asan --output-on-failure --timeout 240
      - name: Native backend + ASan/UBSan, window test output
        id: native_asan_window
        continue-on-error: true
        env:
          ZP_REQUIRE_DISPLAY: "1"
        run: ctest --test-dir build-native-asan -R test_cocoa_window -V --timeout 240

      # information only (not in the verdict): what the leaks tool finds in the window test after its 300 create/destroy rounds
      - name: Native backend, leaks report
        continue-on-error: true
        timeout-minutes: 6
        env:
          ZP_REQUIRE_DISPLAY: "1"
        run: |
          cd build-native/tests
          leaks --atExit -- ./test_cocoa_window > ../../leaks.log 2>&1 || true
          # the summary and what the tool says about each leak, up to the list of images it prints last
          sed -n '1,/^Binary Images/p' ../../leaks.log | grep -v "^ *0x[0-9a-f]* - " | cut -c1-200 | head -150
          echo "--- leaks that name this library or AppKit objects of a window:"
          grep -E "Zen[A-Z]|backend_cocoa|NSWindow|NSTrackingArea|NSThemeFrame" ../../leaks.log | cut -c1-200 | head -40 || true

      - name: Verdict
        if: always()
        run: |
          failed=0
          check() { echo "$1: $2"; [ "$2" = success ] || failed=1; }
          check "fake build         " "${{ steps.fake_build.outcome }}"
          check "fake warnings      " "${{ steps.fake_warn.outcome }}"
          check "fake ctest         " "${{ steps.fake_test.outcome }}"
          check "fake asan build    " "${{ steps.fake_asan_build.outcome }}"
          check "fake asan ctest    " "${{ steps.fake_asan_test.outcome }}"
          check "native build       " "${{ steps.native_build.outcome }}"
          check "native warnings    " "${{ steps.native_warn.outcome }}"
          check "native ctest       " "${{ steps.native_test.outcome }}"
          check "native window test " "${{ steps.native_window.outcome }}"
          check "native asan build  " "${{ steps.native_asan_build.outcome }}"
          check "native asan ctest  " "${{ steps.native_asan_test.outcome }}"
          check "native asan window " "${{ steps.native_asan_window.outcome }}"
          exit $failed
