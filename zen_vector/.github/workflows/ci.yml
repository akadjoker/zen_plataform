name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (gcc, sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with sanitizers and test
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Wpedantic" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j
          ctest --test-dir build-asan --output-on-failure
      - name: Release build, test and benchmark
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror"
          cmake --build build -j
          ctest --test-dir build --output-on-failure
          build/bench_pixel
          build/bench_raster
      - name: Library only, no tools
        run: |
          cmake -S . -B build-lib -DZV_BUILD_TOOLS=OFF
          cmake --build build-lib -j
      - name: Package
        run: |
          mkdir -p stage/lib
          cp build/libzen_vector.a stage/lib/
          cp -r include README.md stage/
      - uses: actions/upload-artifact@v4
        with:
          name: zen_vector-linux-x64
          path: stage

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build and test
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage/lib | Out-Null
          Copy-Item build/Release/zen_vector.lib stage/lib/
          Copy-Item -Recurse include stage/
          Copy-Item README.md stage/
      - uses: actions/upload-artifact@v4
        with:
          name: zen_vector-windows-x64
          path: stage

  macos:
    name: macOS (arm64, NEON)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic"
          cmake --build build -j
          ctest --test-dir build --output-on-failure
          build/bench_pixel

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create archives
        run: |
          mkdir -p dist
          for dir in artifacts/*; do
            (cd "$dir" && zip -qr "../../dist/$(basename "$dir")-${{ github.ref_name }}.zip" .)
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
